# =========================================================================
# Docker Compose - Hospital del Computador
# Producción para VPS Hostinger Ubuntu 24.04 LTS (2 vCPU, 8 GB RAM)
# =========================================================================

services:
  # -----------------------------------------------------------------------
  # 1. Base de Datos Relacional PostgreSQL
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hdc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hdc}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hdc_network
    # NOTA DE SEGURIDAD: El puerto 5432 NO se expone a Internet.
    # Solo es accesible internamente dentro de la red privada hdc_network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-hdc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1536M

  # -----------------------------------------------------------------------
  # 2. Backend NestJS (API REST + Socket.IO + Documentos + R2)
  # -----------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hdc_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-hdc}
      DB_SSL: "false"
      DB_SYNCHRONIZE: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-2h}
      FRONTEND_URL: ${FRONTEND_URL:-https://elhospitaldelcomputador.com}
      # Integración de Correo (Brevo)
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      # Integración de Almacenamiento (Cloudflare R2)
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PRESIGNED_EXPIRATION: ${R2_PRESIGNED_EXPIRATION:-900}
      # Credenciales para Seeder de Administrador Inicial
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador}
      INITIAL_ADMIN_LASTNAME: ${INITIAL_ADMIN_LASTNAME:-General}
      INITIAL_ADMIN_CEDULA: ${INITIAL_ADMIN_CEDULA:-0600000000}
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:-0999999999}
      INITIAL_ADMIN_ADDRESS: ${INITIAL_ADMIN_ADDRESS:-Matriz Riobamba}
      INITIAL_ADMIN_CITY: ${INITIAL_ADMIN_CITY:-Riobamba}
    volumes:
      - backend_uploads:/app/uploads
      - backend_certs:/app/certs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hdc_network
    # NOTA DE SEGURIDAD: El puerto 3000 NO se expone a Internet.
    # Solo el proxy inverso Caddy recibe tráfico público y redirige internamente.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1536M

  # -----------------------------------------------------------------------
  # 3. Frontend Next.js (Dashboard + Portal Clientes + NextAuth)
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://elhospitaldelcomputador.com/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://elhospitaldelcomputador.com}
    container_name: hdc_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      INTERNAL_BACKEND_URL: http://backend:3000/api/v1
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://elhospitaldelcomputador.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://elhospitaldelcomputador.com/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://elhospitaldelcomputador.com}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hdc_network
    # NOTA DE SEGURIDAD: El puerto 4000 NO se expone a Internet.
    # El proxy Caddy atiende al cliente final en los puertos estándar 80/443.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1536M

  # -----------------------------------------------------------------------
  # 4. Proxy Inverso Caddy (Terminación SSL / TLS Automático + WebSockets)
  # -----------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: hdc_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Soporte para HTTP/3 QUIC
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-elhospitaldelcomputador.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@elhospitaldelcomputador.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - hdc_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

# -------------------------------------------------------------------------
# Volúmenes Persistentes
# -------------------------------------------------------------------------
volumes:
  postgres_data:
    name: hdc_postgres_data
  backend_uploads:
    name: hdc_backend_uploads
  backend_certs:
    name: hdc_backend_certs
  caddy_data:
    name: hdc_caddy_data
  caddy_config:
    name: hdc_caddy_config

# -------------------------------------------------------------------------
# Red Privada Aislada
# -------------------------------------------------------------------------
networks:
  hdc_network:
    name: hdc_network
    driver: bridge

